name: Security Scan
permissions:
  contents: read

on:
  pull_request:
    branches: [main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (local)
        run: docker build -t breakglass:scan .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.22.0
        with:
          image-ref: breakglass:scan
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0.17.6
        with:
          image: breakglass:scan
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sbom
          path: sbom-spdx.json